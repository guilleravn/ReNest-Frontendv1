name: CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, format, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: e2e tests (against real backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ReNest-Frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: guilleravn/ReNest-Backend
          ref: develop
          token: ${{ secrets.RENEST_CROSS_REPO_TOKEN }}
          persist-credentials: false
          path: ReNest-Backend

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ReNest-Frontend/package-lock.json
            ReNest-Backend/package-lock.json

      - name: Start backend stack (Postgres + API)
        working-directory: ReNest-Backend
        run: |
          cat <<'EOF' > .env
          PORT=3000
          POSTGRES_USER=renest
          POSTGRES_PASSWORD=renest
          POSTGRES_DB=renest
          DATABASE_URL="postgresql://renest:renest@localhost:5432/renest?schema=public"
          EOF
          npm ci
          npm run prisma:generate
          npm run docker:up

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Backend did not become ready in time" >&2
          exit 1

      - name: Install frontend deps and Playwright browsers
        working-directory: ReNest-Frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: ReNest-Frontend
        env:
          API_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Stop backend stack
        if: always()
        working-directory: ReNest-Backend
        run: npm run docker:down
